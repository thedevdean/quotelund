<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start your free trial — Quotelund (concept)</title>
<meta name="description" content="Concept sign-up flow for Quotelund, designed by McJames Studio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui,sans-serif;padding:24px">This concept site needs JavaScript to run.</p></noscript>
<script type="text/x-template" id="tpl">
<div class="auth">

<main class="auth-main">
<a class="auth-logo" href="index.html" aria-label="Back to the Quotelund home page">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"></rect><path d="M10.5 7h8.2l4.8 4.8v12.2a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" fill="var(--paper)"></path><path d="M18.7 7v4.8h4.8" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"></path><path d="M12.6 18.4l2.6 2.6 4.9-5.4" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>Quotelund</span>
</a>

<div class="auth-body">
<div class="auth-form">

<sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
<div class="auth-stack rise">
<div>
<h1 class="auth-title">Start your 14-day trial</h1>
<p class="auth-lead">No card needed. Send your first proposal today.</p>
</div>
<div class="field"><label for="su-name">Full name</label><input id="su-name" class="{{nameClass}}" type="text" name="name" autocomplete="name" placeholder="Anna Lind" value="{{name}}" onChange="{{onName}}" aria-invalid="{{nameBad}}" aria-describedby="su-name-err"><sc-if value="{{nameBad}}" hint-placeholder-val="{{false}}"><span id="su-name-err" class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter your full name.</span></sc-if></div>
<div class="field"><label for="su-email">Work email</label><input id="su-email" class="{{emailClass}}" type="email" name="email" autocomplete="email" placeholder="anna@nordlys.dk" value="{{email}}" onChange="{{onEmail}}" aria-invalid="{{emailBad}}" aria-describedby="su-email-help"><sc-if value="{{emailBad}}" hint-placeholder-val="{{false}}"><span id="su-email-help" class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter a work email, like anna@nordlys.dk.</span></sc-if><sc-if value="{{emailOk}}" hint-placeholder-val="{{true}}"><span id="su-email-help" class="help">We'll send a link to confirm it's you.</span></sc-if></div>
<div class="field"><label for="su-agency">Studio name</label><input id="su-agency" class="{{agencyClass}}" type="text" name="agency" autocomplete="organization" placeholder="Nordlys Studio" value="{{agency}}" onChange="{{onAgency}}" aria-invalid="{{agencyBad}}" aria-describedby="su-agency-err"><sc-if value="{{agencyBad}}" hint-placeholder-val="{{false}}"><span id="su-agency-err" class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter your studio's name.</span></sc-if></div>
<div role="radiogroup" aria-labelledby="su-size" style="display: flex; flex-direction: column; gap: 8px">
<span id="su-size" class="legend">Team size</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="{{size1}}" class="{{size1Class}}" onClick="{{pick1}}">Just me</button>
<button type="button" role="radio" aria-checked="{{size2}}" class="{{size2Class}}" onClick="{{pick2}}">2–5</button>
<button type="button" role="radio" aria-checked="{{size3}}" class="{{size3Class}}" onClick="{{pick3}}">6–20</button>
<button type="button" role="radio" aria-checked="{{size4}}" class="{{size4Class}}" onClick="{{pick4}}">21+</button>
</div>
</div>
<label class="check"><input type="checkbox" name="tips">Send me occasional tips on writing proposals that win</label>
<button type="button" class="btn btn-p" onClick="{{submit}}">Create my account</button>
<p class="auth-fine">By creating an account you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
<p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div class="auth-ok rise" role="status">
<span class="auth-ok-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
<h1 class="auth-title">Check your inbox</h1>
<p>We've sent a confirmation link to your work email. Click it to open Quotelund and start your first proposal from a template.</p>
<div class="auth-ok-actions">
<a class="btn btn-s" href="index.html">Back to the home page</a>
<button type="button" class="linkbtn" onClick="{{reset}}">Use a different email</button>
</div>
</div>
</sc-if>

</div>
</div>

<p class="auth-credit">Concept design by McJames Studio. Quotelund is a fictional product.</p>
</main>

<aside class="auth-side grainy" aria-label="What studios say">
<figure class="auth-quote">
<blockquote><p>“Clients sign and pay the deposit in the same link. We stopped chasing invoices in the first week.”</p></blockquote>
<figcaption><span class="auth-name">Thabo Nkosi</span><span>Creative Director, Fieldwork, Cape Town</span></figcaption>
</figure>
</aside>

</div>
</script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const size = s.size || 2;
    const done = !!s.done;
    const cls = (n) => 'pill ' + (size === n ? 'pill-on' : 'pill-off');
    const name = s.name || '';
    const email = s.email || '';
    const agency = s.agency || '';
    const tried = !!s.tried;
    const nameBad = tried && name.trim() === '';
    const emailBad = tried && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
    const agencyBad = tried && agency.trim() === '';
    const inp = (bad) => 'inp' + (bad ? ' inp-err' : '');
    return {
      showForm: !done,
      done: done,
      name: name, email: email, agency: agency,
      nameBad: nameBad, emailBad: emailBad, emailOk: !emailBad, agencyBad: agencyBad,
      nameClass: inp(nameBad), emailClass: inp(emailBad), agencyClass: inp(agencyBad),
      onName: (e) => this.setState({ name: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onAgency: (e) => this.setState({ agency: e.target.value }),
      size1: size === 1, size2: size === 2, size3: size === 3, size4: size === 4,
      size1Class: cls(1), size2Class: cls(2), size3Class: cls(3), size4Class: cls(4),
      pick1: () => this.setState({ size: 1 }),
      pick2: () => this.setState({ size: 2 }),
      pick3: () => this.setState({ size: 3 }),
      pick4: () => this.setState({ size: 4 }),
      submit: () => {
        const ok = name.trim() !== '' && agency.trim() !== '' && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
        this.setState(ok ? { done: true, tried: false } : { tried: true });
      },
      reset: () => this.setState({ done: false, email: '' })
    };
  }
}
window.DCRuntime.mount(Component);
</script>
</body>
</html>
