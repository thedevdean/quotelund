<style>
body{margin:0;background:var(--paper)}
a{color:#3f6b4f}a:hover{color:#325641}
:focus-visible{outline:2px solid #3f6b4f;outline-offset:2px}
.ql{container-type:inline-size;font-family:var(--font-sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.disp{font-family:var(--font-sans);font-weight:600;letter-spacing:-0.03em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font:500 15px/1 var(--font-sans);text-decoration:none;box-sizing:border-box;border:1px solid transparent;white-space:nowrap;cursor:pointer}
.btn-p{background:#3f6b4f;color:#ffffff;box-shadow:0 1px 2px rgba(22,24,29,0.06)}
.btn-p:hover{background:#325641;color:#ffffff}
.btn-s{background:#ffffff;color:var(--ink);border-color:#8a877f}
.btn-s:hover{background:#efede7;color:var(--ink)}
.btn-w{background:#ffffff;color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,0.12)}
.btn-w:hover{background:#efede7;color:var(--ink)}
.btn-o{background:transparent;color:#ffffff;border-color:rgba(255,255,255,0.6)}
.btn-o:hover{background:rgba(255,255,255,0.1);color:#ffffff}
.hero :focus-visible{outline-color:#ffffff}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font:500 12px/20px var(--font-sans);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.label{font:500 12px/16px var(--font-sans);letter-spacing:0.06em;text-transform:uppercase;color:#5c5f66}
.num{font-variant-numeric:tabular-nums}
.navlinks a{color:#5c5f66;text-decoration:none;font-size:14px;font-weight:500}
.navlinks a:hover{color:var(--ink)}
.menu{display:none}
.foot a{color:#5c5f66;text-decoration:none;font-size:14px}
.foot a:hover{color:var(--ink)}
.btn{transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.btn:active{transform:translateY(1px)}
@keyframes ql-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ql-pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,107,79,0.45)}50%{box-shadow:0 0 0 5px rgba(63,107,79,0)}}
.rise{animation:ql-rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise-1{animation-delay:.06s}.rise-2{animation-delay:.12s}.rise-3{animation-delay:.18s}.rise-4{animation-delay:.3s}
.lift{transition:transform .2s ease,box-shadow .2s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(22,24,29,0.10)}
.live::before{animation:ql-pulse 2.4s ease-in-out infinite}
@supports (animation-timeline: view()){.reveal{animation:ql-rise linear both;animation-timeline:view();animation-range:entry 0% entry 60%}}
@media (prefers-reduced-motion: reduce){.rise,.reveal,.live::before{animation:none !important}.lift,.lift:hover,.btn,.btn:active{transition:none !important;transform:none !important}}
span.btn{cursor:default}
.seg{min-height:40px;padding:0 16px;border:0;border-radius:999px;font:500 14px var(--font-sans);cursor:pointer;transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.seg-on{background:#ffffff;color:var(--ink);box-shadow:0 1px 2px rgba(22,24,29,0.08)}
.seg-off{background:transparent;color:#5c5f66}
.seg-off:hover{color:var(--ink)}
.pkg{display:block;width:100%;text-align:left;border-radius:8px;cursor:pointer;font-family:inherit;transition:border-color .15s ease,background-color .15s ease}
.pkg-on{border:2px solid #3f6b4f;background:#e3ece5;color:#325641;padding:10px 11px}
.pkg-off{border:1px solid #8a877f;background:#ffffff;color:#5c5f66;padding:11px 12px}
.pkg-off:hover{background:var(--paper)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0;border:0;background:transparent;font:400 14px var(--font-sans);color:var(--ink);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.chk{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex-shrink:0;transition:background-color .15s ease}
.chk-on{background:#3f6b4f}
.chk-off{border:1px solid #8a877f;background:#ffffff}
.chk-off svg{display:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.plan{position:relative;border-radius:14px;display:flex;flex-direction:column;gap:20px;cursor:pointer;box-sizing:border-box;transition:border-color .2s ease,background-color .2s ease,box-shadow .2s ease,transform .2s ease}
.plan-off{border:1px solid #e4e2dc;background:var(--paper);padding:28px}
.plan-off:hover{border-color:#8a877f}
.plan-on{border:2px solid #3f6b4f;background:#ffffff;padding:27px;box-shadow:0 12px 32px rgba(22,24,29,0.10)}
.plan:has(.sr:focus-visible){outline:2px solid #3f6b4f;outline-offset:3px}
.dot{width:20px;height:20px;border-radius:999px;box-sizing:border-box;flex-shrink:0;transition:border-width .15s ease,border-color .15s ease}
.dot-off{border:1.5px solid #8a877f;background:#ffffff}
.dot-on{border:6px solid #3f6b4f;background:#ffffff}
.faq-ic::before{content:"+"}
details[open] .faq-ic::before{content:"\2212"}
details[open] summary{color:#325641}
.mmenu{display:none;flex-direction:column;border-top:1px solid #e4e2dc;background:var(--paper);padding:4px 16px 20px}
.mlink{display:flex;align-items:center;min-height:48px;border-bottom:1px solid #e4e2dc;color:var(--ink);text-decoration:none;font-size:16px;font-weight:500}
.mlink:hover{color:#3f6b4f}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:#3f6b4f;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:#325641}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,0.55);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;animation:ql-fade .2s ease both}
.dialog{position:relative;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;background:#ffffff;border-radius:14px;padding:32px;box-sizing:border-box;box-shadow:0 24px 64px rgba(22,24,29,0.25);animation:ql-rise .3s cubic-bezier(.2,.7,.2,1) both}
.dclose{position:absolute;top:16px;right:16px;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:#5c5f66;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dclose:hover{background:#efede7;color:var(--ink)}
@keyframes ql-fade{from{opacity:0}to{opacity:1}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;line-height:20px;color:var(--ink)}
.inp{height:44px;padding:0 12px;border:1px solid #8a877f;border-radius:8px;background:#ffffff;color:var(--ink);font:400 15px var(--font-sans);box-sizing:border-box;width:100%}
.inp::placeholder{color:#5c5f66}
.inp:focus{outline:2px solid #3f6b4f;outline-offset:1px;border-color:#3f6b4f}
.inp-err{border-color:#b3261e}
.err{font-size:13px;line-height:20px;color:#b3261e}
.pill{min-height:44px;padding:0 10px;border-radius:8px;font:500 14px var(--font-sans);cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
.pill-on{border:2px solid #3f6b4f;background:#e3ece5;color:#325641;padding:0 9px}
.pill-off{border:1px solid #8a877f;background:#ffffff;color:var(--ink)}
.pill-off:hover{background:var(--paper)}
@media (prefers-reduced-motion: reduce){.overlay,.dialog{animation:none !important}}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@container (max-width: 1080px){
.side{display:none !important}
}
@container (max-width: 760px){
.navlinks,.login{display:none !important}
.menu{display:inline-flex !important}
.wrap{padding:0 16px !important}
.side,.activity{display:none !important}
.sec{padding-top:64px !important;padding-bottom:64px !important}
.hero{padding-top:48px !important}
.cta-panel{padding:40px 24px !important}
.demo{padding:16px !important}
.tl{display:none !important}
.mmenu{display:flex}
.dialog{padding:24px 20px}
.hero-cta{flex-direction:column;width:100%;max-width:340px}
.hero-cta .btn{width:100%}
.hdr-cta{padding:0 14px !important;font-size:14px !important}
}
</style>
<style>
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:76px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>

<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const yearly = s.billing === 'yearly';
    const pkg = s.pkg || 'complete';
    const motion = s.motion !== undefined ? s.motion : true;
    const copy = !!s.copy;
    const total = (pkg === 'complete' ? 18400 : 14200) + (motion ? 1600 : 0) + (copy ? 2200 : 0);
    const menuOpen = !!s.menu;
    const demoOpen = !!s.demo;
    const demoDone = !!s.demoDone;
    const dName = s.dName || '';
    const dEmail = s.dEmail || '';
    const dTried = !!s.dTried;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const dNameBad = dTried && dName.trim() === '';
    const dEmailBad = dTried && !emailRe.test(dEmail.trim());
    const dSize = s.dSize || 1;
    const pill = (n) => 'pill ' + (dSize === n ? 'pill-on' : 'pill-off');
    const openDemo = () => this.setState({ demo: true, demoDone: false, dTried: false, menu: false });
    const plan = s.plan || 'studio';
    const card = (p) => 'plan lift reveal ' + (plan === p ? 'plan-on' : 'plan-off');
    const cta = (p) => 'btn ' + (plan === p ? 'btn-p' : 'btn-s');
    const dot = (p) => 'dot ' + (plan === p ? 'dot-on' : 'dot-off');
    return {
      isSolo: plan === 'solo',
      isStudio: plan === 'studio',
      isAgency: plan === 'agency',
      soloCard: card('solo'),
      studioCard: card('studio'),
      agencyCard: card('agency'),
      soloCta: cta('solo'),
      studioCta: cta('studio'),
      agencyCta: cta('agency'),
      soloDot: dot('solo'),
      studioDot: dot('studio'),
      agencyDot: dot('agency'),
      pickSolo: () => this.setState({ plan: 'solo' }),
      pickStudio: () => this.setState({ plan: 'studio' }),
      pickAgency: () => this.setState({ plan: 'agency' }),
      talkSales: () => this.setState({ plan: 'agency', demo: true, demoDone: false, dTried: false, dSize: 3 }),
      menuOpen: menuOpen,
      menuClosed: !menuOpen,
      menuLabel: menuOpen ? 'Close menu' : 'Open menu',
      toggleMenu: () => this.setState({ menu: !menuOpen }),
      closeMenu: (e) => {
        const link = e && e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
        this.setState({ menu: false });
        if (!link) return;
        e.preventDefault();
        const hash = link.getAttribute('href');
        setTimeout(() => {
          const target = document.querySelector(hash);
          if (!target) return;
          const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
          try { history.replaceState(null, '', hash); } catch (err) {}
        }, 80);
      },
      demoOpen: demoOpen,
      demoForm: !demoDone,
      demoDone: demoDone,
      openDemo: openDemo,
      closeDemo: () => this.setState({ demo: false }),
      dName: dName, dEmail: dEmail,
      dNameBad: dNameBad, dEmailBad: dEmailBad,
      dNameClass: 'inp' + (dNameBad ? ' inp-err' : ''),
      dEmailClass: 'inp' + (dEmailBad ? ' inp-err' : ''),
      onDName: (e) => this.setState({ dName: e.target.value }),
      onDEmail: (e) => this.setState({ dEmail: e.target.value }),
      dSize1: dSize === 1, dSize2: dSize === 2, dSize3: dSize === 3, dSize4: dSize === 4,
      dSize1Class: pill(1), dSize2Class: pill(2), dSize3Class: pill(3), dSize4Class: pill(4),
      dPick1: () => this.setState({ dSize: 1 }),
      dPick2: () => this.setState({ dSize: 2 }),
      dPick3: () => this.setState({ dSize: 3 }),
      dPick4: () => this.setState({ dSize: 4 }),
      submitDemo: () => {
        const ok = dName.trim() !== '' && emailRe.test(dEmail.trim());
        this.setState(ok ? { demoDone: true, dTried: false } : { dTried: true });
      },
      isMonthly: !yearly,
      isYearly: yearly,
      monthlyClass: 'seg ' + (yearly ? 'seg-off' : 'seg-on'),
      yearlyClass: 'seg ' + (yearly ? 'seg-on' : 'seg-off'),
      setMonthly: () => this.setState({ billing: 'monthly' }),
      setYearly: () => this.setState({ billing: 'yearly' }),
      soloPrice: yearly ? '€16' : '€19',
      soloNote: yearly ? '€190 billed yearly' : 'Billed monthly',
      studioPrice: yearly ? '€41' : '€49',
      studioNote: yearly ? '€490 billed yearly' : 'Billed monthly',
      isEss: pkg === 'essential',
      isComp: pkg === 'complete',
      essClass: 'pkg ' + (pkg === 'essential' ? 'pkg-on' : 'pkg-off'),
      compClass: 'pkg ' + (pkg === 'complete' ? 'pkg-on' : 'pkg-off'),
      pickEss: () => this.setState({ pkg: 'essential' }),
      pickComp: () => this.setState({ pkg: 'complete' }),
      motion: motion,
      copy: copy,
      motionBox: 'chk ' + (motion ? 'chk-on' : 'chk-off'),
      copyBox: 'chk ' + (copy ? 'chk-on' : 'chk-off'),
      toggleMotion: () => this.setState({ motion: !motion }),
      toggleCopy: () => this.setState({ copy: !copy }),
      total: '€' + total.toLocaleString('en-US')
    };
  }
}
window.DCRuntime.mount(Component);
</script>
</body>
</html>
