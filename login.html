<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Quotelund (concept)</title>
<meta name="description" content="Concept log-in screen for Quotelund, designed by McJames Studio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui,sans-serif;padding:24px">This concept site needs JavaScript to run.</p></noscript>
<script type="text/x-template" id="tpl">
<div class="auth">

<main class="auth-main">
<a class="auth-logo" href="index.html" aria-label="Back to the Quotelund home page">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"></rect><path d="M10.5 7h8.2l4.8 4.8v12.2a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" fill="var(--paper)"></path><path d="M18.7 7v4.8h4.8" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"></path><path d="M12.6 18.4l2.6 2.6 4.9-5.4" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>Quotelund</span>
</a>

<div class="auth-body">
<div class="auth-form rise">

<sc-if value="{{showLogin}}" hint-placeholder-val="{{true}}">
<div class="auth-stack">
<div>
<h1 class="auth-title">Welcome back</h1>
<p class="auth-lead">Pick up where your proposals left off.</p>
</div>
<div class="field"><label for="li-email">Work email</label><input id="li-email" class="{{emailClass}}" type="email" autocomplete="email" placeholder="anna@nordlys.dk" value="{{email}}" onChange="{{onEmail}}" aria-invalid="{{emailBad}}"><sc-if value="{{emailBad}}" hint-placeholder-val="{{false}}"><span class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter the email you signed up with.</span></sc-if></div>
<div class="field">
<div class="field-row"><label for="li-pw">Password</label><button type="button" class="linkbtn" onClick="{{goForgot}}">Forgot password?</button></div>
<div class="pwwrap"><input id="li-pw" class="{{pwClass}}" type="{{pwType}}" autocomplete="current-password" placeholder="Your password" value="{{pw}}" onChange="{{onPw}}" aria-invalid="{{pwBad}}"><button type="button" class="pwtoggle" aria-pressed="{{pwShown}}" onClick="{{togglePw}}">{{pwToggleLabel}}</button></div>
<sc-if value="{{pwBad}}" hint-placeholder-val="{{false}}"><span class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter your password.</span></sc-if>
</div>
<button type="button" class="btn btn-p" onClick="{{submit}}">Log in</button>
<p class="auth-switch">New to Quotelund? <a href="signup.html">Start your free trial</a></p>
</div>
</sc-if>

<sc-if value="{{showForgot}}" hint-placeholder-val="{{false}}">
<div class="auth-stack">
<div>
<h1 class="auth-title">Reset your password</h1>
<p class="auth-lead">Enter your work email and we'll send you a link to choose a new password.</p>
</div>
<div class="field"><label for="li-reset">Work email</label><input id="li-reset" class="{{emailClass}}" type="email" autocomplete="email" placeholder="anna@nordlys.dk" value="{{email}}" onChange="{{onEmail}}" aria-invalid="{{emailBad}}"><sc-if value="{{emailBad}}" hint-placeholder-val="{{false}}"><span class="err"><svg class="err-ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>Enter a valid email address.</span></sc-if></div>
<button type="button" class="btn btn-p" onClick="{{sendReset}}">Send reset link</button>
<button type="button" class="linkbtn" onClick="{{goLogin}}" style="align-self: center">Back to log in</button>
</div>
</sc-if>

<sc-if value="{{showSent}}" hint-placeholder-val="{{false}}">
<div class="auth-ok" role="status">
<span class="auth-ok-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
<h1 class="auth-title">Check your inbox</h1>
<p>If an account exists for that email, a reset link is on its way. It expires in 30 minutes.</p>
<button type="button" class="btn btn-s" onClick="{{goLogin}}">Back to log in</button>
</div>
</sc-if>

<sc-if value="{{showDone}}" hint-placeholder-val="{{false}}">
<div class="auth-ok" role="status">
<span class="auth-ok-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<h1 class="auth-title">You're logged in</h1>
<p>In the live product, this opens your proposals dashboard. This concept ends here.</p>
<a class="btn btn-s" href="index.html">Back to the home page</a>
</div>
</sc-if>

</div>
</div>

<p class="auth-credit">Concept design by McJames Studio. Quotelund is a fictional product.</p>
</main>

<aside class="auth-side grainy" aria-label="What studios say">
<figure class="auth-quote">
<blockquote><p>“We used to send a proposal and hope. Now we call at the right moment, and most calls end with a signature.”</p></blockquote>
<figcaption><span class="auth-name">Mette Ravn</span><span>Founder, Studio Ravn, Copenhagen</span></figcaption>
</figure>
</aside>

</div>
</script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const view = s.view || 'login';
    const email = s.email || '';
    const pw = s.pw || '';
    const tried = !!s.tried;
    const shown = !!s.shown;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const emailBad = tried && !emailRe.test(email.trim());
    const pwBad = tried && view === 'login' && pw === '';
    return {
      showLogin: view === 'login',
      showForgot: view === 'forgot',
      showSent: view === 'sent',
      showDone: view === 'done',
      email: email, pw: pw,
      emailBad: emailBad, pwBad: pwBad,
      emailClass: 'inp' + (emailBad ? ' inp-err' : ''),
      pwClass: 'inp' + (pwBad ? ' inp-err' : ''),
      pwType: shown ? 'text' : 'password',
      pwShown: shown,
      pwToggleLabel: shown ? 'Hide' : 'Show',
      togglePw: () => this.setState({ shown: !shown }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      goForgot: () => this.setState({ view: 'forgot', tried: false }),
      goLogin: () => this.setState({ view: 'login', tried: false }),
      submit: () => {
        const ok = emailRe.test(email.trim()) && pw !== '';
        this.setState(ok ? { view: 'done', tried: false } : { tried: true });
      },
      sendReset: () => {
        const ok = emailRe.test(email.trim());
        this.setState(ok ? { view: 'sent', tried: false } : { tried: true });
      }
    };
  }
}
window.DCRuntime.mount(Component);
</script>
</body>
</html>
